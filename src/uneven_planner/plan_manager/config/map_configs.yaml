# 不同地图的配置参数
# 使用方法：在启动文件中根据地图名称选择相应的参数

# 沙漠地图配置
desert:
  map_boundaries:
    x_min: -5.0
    x_max: 5.0
    y_min: -5.0
    y_max: 5.0
    min_distance: 2.0
  generation_params:
    path_num: 1000
    sample_density: 0.1
    publish_delay: 2.0

